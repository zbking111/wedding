media:
  input: media/images
  output: /media/images
  rename: safe
  categories: [image, audio]

content:
  - name: site
    label: Nội dung trang cưới
    type: file
    path: content/site.json
    format: json
    fields:
      - name: inviteTool
        label: "🔗 👉 TRANG TẠO LINK THIỆP MỜI CHO KHÁCH 👈"
        type: string
        readonly: true
        description: "Sao chép link trong ô trên, dán vào trình duyệt để mở trang tạo link thiệp mời theo tên từng khách."
      - { name: groomName, label: Tên chú rể, type: string, required: true }
      - { name: brideName, label: Tên cô dâu, type: string, required: true }
      - { name: weddingDate, label: Ngày cưới (dùng cho đếm ngược và lịch), type: date, required: true }
      - { name: weddingTime, label: "Giờ tiệc chính (ví dụ 11:00)", type: string }
      - { name: lunarText, label: Ngày âm lịch, type: string }
      - { name: heroPhoto, label: "Ảnh bìa (ảnh dọc, tỉ lệ 3:4)", type: image, description: "Dùng ảnh GỐC từ studio hoặc điện thoại, KHÔNG lấy ảnh đã gửi qua Zalo/Messenger/Facebook (bị nén, lên web sẽ mờ). Cạnh dài 2000–3000 px, dưới 3 MB. Ảnh gốc nặng hơn 3 MB thì thu nhỏ cạnh dài về 2400 px rồi mới tải lên (Mac: mở bằng Preview → Công cụ → Điều chỉnh kích thước; hoặc web squoosh.app, chất lượng 85)." }
      - { name: music, label: Nhạc nền (file mp3), type: file }
      - { name: youtubeId, label: "ID video YouTube (phần sau v= trong link)", type: string }
      - { name: videoQuote, label: Câu trích mục Video, type: text }
      - { name: albumQuote, label: Câu trích mục Album, type: text }
      - { name: letter, label: "Lời ngỏ (cách đoạn bằng một dòng trống)", type: text }
      - { name: letterPhoto, label: Ảnh cặp đôi dưới lời ngỏ (ảnh dọc đẹp nhất), type: image, description: "Dùng ảnh GỐC từ studio hoặc điện thoại, KHÔNG lấy ảnh đã gửi qua Zalo/Messenger/Facebook (bị nén, lên web sẽ mờ). Cạnh dài 2000–3000 px, dưới 3 MB. Ảnh gốc nặng hơn 3 MB thì thu nhỏ cạnh dài về 2400 px rồi mới tải lên (Mac: mở bằng Preview → Công cụ → Điều chỉnh kích thước; hoặc web squoosh.app, chất lượng 85)." }
      - name: photos
        label: Album ảnh cưới (6 ảnh đầu hiện sẵn)
        type: image
        list: true
        description: "Dùng ảnh GỐC từ studio hoặc điện thoại, KHÔNG lấy ảnh đã gửi qua Zalo/Messenger/Facebook (bị nén, lên web sẽ mờ). Cạnh dài 2000–3000 px, dưới 3 MB. Ảnh gốc nặng hơn 3 MB thì thu nhỏ cạnh dài về 2400 px rồi mới tải lên (Mac: mở bằng Preview → Công cụ → Điều chỉnh kích thước; hoặc web squoosh.app, chất lượng 85)."
      - name: events
        label: Sự kiện cưới
        type: object
        list: true
        fields:
          - { name: title, label: Tên sự kiện, type: string }
          - { name: date, label: Ngày, type: date }
          - { name: time, label: "Giờ (ví dụ 08:00)", type: string }
          - { name: place, label: Địa điểm, type: string }
          - { name: addr, label: Địa chỉ, type: string }
          - { name: map, label: "Link Google Maps (không bắt buộc)", type: string }
          - name: side
            label: Sự kiện của nhà nào (dùng cho thiệp mời theo tên)
            type: select
            options:
              values: [trai, gai]
          - { name: invite, label: Hiện sự kiện này trên thiệp mời, type: boolean }
          - { name: lunar, label: "Ngày âm lịch của sự kiện (ví dụ Tức ngày 08 tháng 09 năm Bính Ngọ)", type: string }
          - name: colors
            label: "Dress code – mã màu, ví dụ #c9a9a6 (không bắt buộc)"
            type: string
            list: true
      - name: groom
        label: Chú rể
        type: object
        fields:
          - { name: photo, label: Ảnh chú rể, type: image, description: "Dùng ảnh gốc, không lấy ảnh qua Zalo/Messenger. Khoảng 1000–1500 px, dưới 3 MB." }
          - { name: bio, label: Giới thiệu, type: text }
          - { name: father, label: Tên bố chú rể, type: string }
          - { name: mother, label: Tên mẹ chú rể, type: string }
      - name: bride
        label: Cô dâu
        type: object
        fields:
          - { name: photo, label: Ảnh cô dâu, type: image, description: "Dùng ảnh gốc, không lấy ảnh qua Zalo/Messenger. Khoảng 1000–1500 px, dưới 3 MB." }
          - { name: bio, label: Giới thiệu, type: text }
          - { name: father, label: Tên bố cô dâu, type: string }
          - { name: mother, label: Tên mẹ cô dâu, type: string }
      - name: gifts
        label: Hộp mừng cưới
        type: object
        list: true
        fields:
          - { name: title, label: Tiêu đề, type: string }
          - { name: bank, label: Ngân hàng, type: string }
          - { name: no, label: Số tài khoản, type: string }
          - { name: name, label: Chủ tài khoản, type: string }
          - { name: qr, label: Ảnh mã QR, type: image, description: "Ảnh chụp màn hình mã QR từ app ngân hàng, rõ nét, không cắt mất góc." }
      - { name: storyQuote, label: Câu trích mục Chuyện tình yêu, type: text }
      - name: stories
        label: Chuyện tình yêu (mỗi mốc là một thẻ)
        type: object
        list: true
        fields:
          - { name: date, label: "Mốc thời gian (ví dụ 06/2021)", type: string }
          - { name: title, label: Tiêu đề, type: string }
          - { name: text, label: Câu chuyện, type: text }
          - { name: photo, label: Ảnh, type: image, description: "Dùng ảnh gốc, không lấy ảnh qua Zalo/Messenger. Khoảng 1000–1500 px, dưới 3 MB." }
      - name: bridesmaids
        label: Phù dâu
        type: object
        list: true
        fields:
          - { name: name, label: Tên, type: string }
          - { name: photo, label: Ảnh, type: image, description: "Dùng ảnh gốc, không lấy ảnh qua Zalo/Messenger. Khoảng 1000–1500 px, dưới 3 MB." }
          - { name: intro, label: Giới thiệu ngắn, type: string }
      - name: groomsmen
        label: Phù rể
        type: object
        list: true
        fields:
          - { name: name, label: Tên, type: string }
          - { name: photo, label: Ảnh, type: image, description: "Dùng ảnh gốc, không lấy ảnh qua Zalo/Messenger. Khoảng 1000–1500 px, dưới 3 MB." }
          - { name: intro, label: Giới thiệu ngắn, type: string }
      - name: wishSuggestions
        label: Lời chúc gợi ý (để trống sẽ dùng câu mặc định)
        type: string
        list: true
      - name: sections
        label: Ẩn/hiện các mục (bỏ tick để ẩn)
        type: object
        fields:
          - { name: video, label: Video cưới, type: boolean, default: true }
          - { name: album, label: Album ảnh, type: boolean, default: true }
          - { name: calendar, label: Lịch và đếm ngược, type: boolean, default: true }
          - { name: story, label: Chuyện tình yêu, type: boolean, default: true }
          - { name: letter, label: Lời ngỏ, type: boolean, default: true }
          - { name: events, label: Sự kiện cưới, type: boolean, default: true }
          - { name: couple, label: Cô dâu & chú rể, type: boolean, default: true }
          - { name: party, label: Phù dâu & phù rể, type: boolean, default: true }
          - { name: gifts, label: Hộp mừng cưới, type: boolean, default: true }
          - { name: wishes, label: Sổ lưu bút, type: boolean, default: true }
          - { name: rsvp, label: Xác nhận tham dự, type: boolean, default: true }
          - { name: hearts, label: Hiệu ứng thả tim, type: boolean, default: true }
          - { name: invite, label: Màn hình thiệp mời khi mở trang, type: boolean, default: true }
      - { name: apiUrl, label: Link Apps Script (không sửa), type: string }
