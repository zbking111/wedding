<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tạo link thiệp mời</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#f8f1f1;--card:#fff;--ink:#2b2224;--muted:#7b6b6d;--wine:#8c2f39;--wine-deep:#6b1f28;--line:#ead9da;
  --f-script:"Dancing Script","Brush Script MT",cursive;--f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--f-body);padding:24px 16px 48px}
main{max-width:720px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--f-script);color:var(--wine);font-size:40px;margin:0;text-align:center;line-height:1.2}
.sub{text-align:center;color:var(--muted);margin:-8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px}
label{font-size:13px;font-weight:500;display:grid;gap:4px}
label .req{color:#c0392b}
label .opt{font-weight:400;color:var(--muted)}
.err{margin:0;color:#c0392b;font-size:12.5px;font-weight:400}
[aria-invalid="true"]{border-color:#c0392b}
.tpl-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.link-btn{border:0;background:none;color:var(--wine);font:500 12.5px var(--f-body);cursor:pointer;padding:0;text-decoration:underline}
textarea,input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fff}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--wine)}
textarea#names{min-height:130px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--wine);background:var(--wine);color:#fff;font:500 14px var(--f-body);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--wine-deep)}
.btn.ghost{background:#fff;color:var(--wine)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.item b{color:var(--wine);font-weight:600}
.item textarea.msg{min-height:84px;font-size:14px}
.item .tpl-head label,.item .fld{font-size:12.5px;color:var(--muted);font-weight:500}
.item .fld{margin-bottom:-2px}
.item code{font-size:12.5px;color:var(--muted);word-break:break-all;background:var(--bg);padding:6px 8px;border-radius:8px}
.item .acts{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:14px}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
/* Màn hình đủ cao: cố định phần nhập liệu, chỉ cuộn danh sách link thiệp cưới */
@media (min-height:640px){
  body{height:100vh;height:100dvh;overflow:hidden;padding-bottom:16px}
  main{height:100%;display:flex;flex-direction:column}
  main>*{flex:none}
  main>.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 4px 24px;margin:0 -4px}
}
.scroll .empty{margin:0}
</style>
</head>
<body>
<main>
  <h1 id="title">Tạo link thiệp mời</h1>
  <p class="sub">Mỗi khách một link riêng, mở ra là thấy tên mình trên thiệp.</p>

  <section class="card">
    <label for="names"><span>Tên khách mời <span class="req">*</span> <span class="opt">(Nếu tạo cho nhiều người thì mỗi dòng một người)</span></span>
      <textarea id="names" required aria-describedby="names-err" placeholder="Anh Hùng và chị Lan&#10;Bác Tư&#10;Bạn Minh"></textarea>
      <p class="err" id="names-err" hidden>Vui lòng nhập tên khách mời.</p></label>
    <div class="row">
      <label for="side"><span>Khách của <span class="req">*</span></span>
        <select id="side" required aria-describedby="side-err"><option value="">Chọn nhà trai hoặc nhà gái</option><option value="trai">Nhà trai</option><option value="gai">Nhà gái</option></select>
        <p class="err" id="side-err" hidden>Vui lòng chọn khách của nhà trai hay nhà gái.</p></label>
      <label for="lang">Khách là người
        <select id="lang"><option value="">Người Việt (mặc định)</option><option value="ja">Người Nhật – thiệp tiếng Nhật</option></select></label>
    </div>
    <label for="base">Địa chỉ trang cưới
      <input id="base" inputmode="url"></label>
    <p class="hint">Thiệp sẽ hiện ngày giờ, địa điểm tiệc của nhà trai hoặc nhà gái theo lựa chọn ở trên.</p>
  </section>

  <div class="bar"><strong id="count">0 link thiệp cưới</strong></div>
  <div class="scroll" id="scroll">
    <div class="list" id="list"></div>
    <p class="empty" id="empty">Nhập tên khách và chọn khách của ai, link thiệp cưới sẽ hiện ra ngay tại đây.</p>
  </div>
</main>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
$("base").value = store.get("base") || (location.origin + "/");
$("names").value = store.get("names") || "";
$("side").value = store.get("side") || "";
$("lang").value = store.get("lang") === "ja" ? "ja" : "";
// Tin nhắn lưu dạng mẫu có chỗ trống: {ten} tên khách, {link} link thiệp cưới, {doi} tên cặp đôi (đổi thứ tự theo nhà trai/nhà gái)
const DEF_VI = "Trân trọng kính mời {ten} đến dự lễ cưới của {doi}. Link thiệp cưới: {link}";
const DEF_JA = "{ten}様\n\nこのたび {doi} は結婚式を挙げることとなりました。\nご多用中とは存じますが、ぜひご出席いただけますと幸いです。\n\n招待状はこちら：{link}";
const defTpl = () => $("lang").value === "ja" ? DEF_JA : DEF_VI;
let custom = {}, S = null; // mẫu đã sửa riêng cho từng khách, theo tên
try { custom = JSON.parse(store.get("tpls") || "{}") || {}; } catch(e){}
const saveCustom = () => store.set("tpls", JSON.stringify(custom));
const couple = side => !S ? "chúng mình" : side === "gai" ? S.brideName + " & " + S.groomName : S.groomName + " & " + S.brideName;
fetch("content/site.json?v=" + Date.now()).then(r => r.json()).then(d => {
  S = d; $("title").textContent = "Thiệp mời " + S.groomName + " & " + S.brideName; render();
}).catch(() => {});

const getNames = () => [...new Set($("names").value.split("\n").map(s => s.trim()).filter(Boolean))];
function linkFor(name){
  const u = new URL($("base").value.trim() || location.origin + "/", location.href);
  u.search = ""; u.searchParams.set("to", name); u.searchParams.set("s", $("side").value); if ($("lang").value === "ja") u.searchParams.set("lang", "ja");
  return u.toString();
}
// Tách mẫu thành các đoạn [chỗ trống | null, nội dung đã điền]
function segsFor(tpl, name){
  const vals = { ten: name, link: linkFor(name), doi: couple($("side").value) }, out = [], re = /\{(ten|link|doi)\}/g; let i = 0, m;
  while ((m = re.exec(tpl))) { if (m.index > i) out.push([null, tpl.slice(i, m.index)]); out.push([m[0], vals[m[1]]]); i = re.lastIndex; }
  if (i < tpl.length) out.push([null, tpl.slice(i)]);
  return out;
}
const joinSegs = segs => segs.map(s => s[1]).join("");
// Người dùng sửa tin nhắn: giữ chỗ trống ở phần không bị sửa, phần bị sửa thành chữ cố định
function tplFromEdit(segs, newStr){
  const oldStr = joinSegs(segs), max = Math.min(oldStr.length, newStr.length);
  let p = 0; while (p < max && oldStr[p] === newStr[p]) p++;
  let q = 0; while (q < max - p && oldStr[oldStr.length - 1 - q] === newStr[newStr.length - 1 - q]) q++;
  const cut = oldStr.length - q, mid = newStr.slice(p, newStr.length - q);
  let out = "", pos = 0, done = false;
  for (const [tok, s] of segs) {
    const start = pos, end = pos + s.length; pos = end;
    if (end <= p && s.length) out += tok || s;
    else if (start >= cut) { if (!done) { out += mid; done = true; } out += tok || s; }
    else { out += s.slice(0, Math.max(0, p - start)); if (!done) { out += mid; done = true; } out += s.slice(Math.max(0, cut - start)); }
  }
  return done ? out : out + mid;
}
function toast(t){ $("toast").textContent = t; $("toast").hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => $("toast").hidden = true, 1800); }
async function copy(text, ok){ try { await navigator.clipboard.writeText(text); toast(ok); } catch(e){ prompt("Sao chép thủ công:", text); } }

// Bắt buộc nhập: chỉ báo lỗi sau khi người dùng đã chạm vào ô
const touched = { names: false, side: false };
function validate(){
  const bad = { names: !getNames().length, side: !$("side").value };
  ["names", "side"].forEach(k => { const show = touched[k] && bad[k]; $(k + "-err").hidden = !show; $(k).setAttribute("aria-invalid", String(show)); });
  return !bad.names && !bad.side;
}

function render(){
  ["names","side","lang","base"].forEach(k => store.set(k, $(k).value));
  const names = validate() ? getNames() : [];
  const list = $("list"); list.textContent = "";
  names.forEach((n, i) => {
    const link = linkFor(n), it = document.createElement("div"); it.className = "item";
    const b = document.createElement("b"); b.textContent = n;
    const cl = document.createElement("span"); cl.className = "fld"; cl.textContent = "Link thiệp cưới";
    const c = document.createElement("code"); c.textContent = link;
    const head = document.createElement("div"); head.className = "tpl-head";
    const lb = document.createElement("label"); lb.htmlFor = "msg-" + i; lb.textContent = "Tin nhắn";
    const reset = document.createElement("button"); reset.type = "button"; reset.className = "link-btn"; reset.textContent = "Dùng lại mẫu mặc định";
    head.append(lb, reset);
    const ta = document.createElement("textarea"); ta.id = "msg-" + i; ta.className = "msg";
    let segs;
    const ck = ($("lang").value === "ja" ? "ja|" : "") + n; // tin đã sửa lưu riêng theo ngôn ngữ
    const fill = () => { segs = segsFor(custom[ck] || defTpl(), n); ta.value = joinSegs(segs); reset.hidden = !custom[ck]; };
    fill();
    ta.addEventListener("input", () => {
      const t = tplFromEdit(segs, ta.value);
      if (t === defTpl()) delete custom[ck]; else custom[ck] = t;
      saveCustom(); segs = segsFor(t, n); reset.hidden = !custom[ck];
    });
    reset.onclick = () => { delete custom[ck]; saveCustom(); fill(); };
    const acts = document.createElement("div"); acts.className = "acts";
    const mk = (label, cls, fn) => { const x = document.createElement("button"); x.type = "button"; x.className = "btn sm " + cls; x.textContent = label; x.onclick = fn; acts.append(x); };
    mk("Sao chép tin nhắn", "", () => copy(ta.value, "Đã sao chép tin nhắn cho " + n));
    mk("Sao chép link thiệp cưới", "ghost", () => copy(link, "Đã sao chép link thiệp cưới cho " + n));
    const o = document.createElement("a"); o.className = "btn sm ghost"; o.href = link; o.target = "_blank"; o.rel = "noopener"; o.textContent = "Xem thử thiệp"; acts.append(o);
    it.append(b, cl, c, head, ta, acts); list.append(it);
  });
  $("count").textContent = names.length + " link thiệp cưới"; $("empty").hidden = !!names.length;
}

["names","side","lang","base"].forEach(k => $(k).addEventListener("input", render));
$("side").addEventListener("change", () => { touched.side = true; render(); });
$("names").addEventListener("blur", () => { touched.names = true; if (getNames().length) touched.side = true; render(); });
$("side").addEventListener("blur", () => { touched.side = true; render(); });
render();
</script>
</body>
</html>
